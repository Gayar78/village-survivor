name: CI

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and simulation tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Les tests navigateur (Playwright smoke/e2e) sont temporairement retirés du CI :
      # depuis l'ajout de la connexion obligatoire (Supabase), l'application affiche
      # d'abord l'écran d'authentification, ce que ces tests ne prennent pas encore en
      # compte, et le CI n'a pas de clés Supabase. À réintroduire une fois les tests
      # adaptés (mock de l'auth / écran de connexion).
