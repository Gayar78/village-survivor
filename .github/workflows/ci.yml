name: CI

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and simulation tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Le smoke test vise `play.html`, qui démarre sans projet Supabase : il est donc
      # exécutable ici alors que le CI n'a aucune clé. Il vérifie que le jeu démarre
      # réellement, que le build n'expose pas d'API de débogage et que la graine reçue
      # par l'URL n'est jamais interprétée comme du HTML.
      # Il n'existe en revanche aucun test de bout en bout du lobby : il exigerait soit
      # un mode invité, soit un mock de l'authentification.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Production smoke test
        run: pnpm test:smoke
