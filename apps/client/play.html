<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121d25" />
    <link rel="icon" href="data:," />
    <title>Village Survivor — Partie</title>
  </head>
  <body>
    <div id="app">
      <div id="game" aria-label="Zone de jeu"></div>
      <div id="hud" aria-live="polite" aria-label="État et arsenal, touches 1 à 3"></div>
      <div id="turret-shop" aria-label="Boutique de tourelle"></div>
      <div id="levelup" aria-label="Montée de niveau"></div>
      <div id="escape-menu" aria-label="Menu de partie"></div>
      <div id="game-over" aria-label="Fin de partie"></div>
      <section
        id="tower-sync-status"
        class="tower-sync-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
      >
        <span class="tower-sync-status__indicator" aria-hidden="true"></span>
        <div>
          <p id="tower-sync-status-title" class="tower-sync-status__title"></p>
          <p id="tower-sync-status-detail" class="tower-sync-status__detail"></p>
        </div>
      </section>
    </div>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
