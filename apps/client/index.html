<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121d25" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Village Survivor — explorez le jour, défendez le village la nuit."
    />
    <title>Village Survivor — M1</title>
  </head>
  <body>
    <div id="app">
      <div id="auth" aria-label="Connexion au compte"></div>
      <div id="main-menu" aria-label="Menu principal"></div>
      <div id="compendium" aria-label="Annuaire du jeu"></div>
      <div id="profile" aria-label="Profil du joueur"></div>
      <div id="settings" aria-label="Paramètres visuels"></div>
      <div id="meta-build" aria-label="Atelier de l’Ingénieur"></div>
      <div id="hub" aria-label="Hub multijoueur"></div>
      <nav class="main-menu-account-bar" id="multiplayer-nav" aria-label="Navigation multijoueur">
        <button type="button" class="main-menu-account-bar__button" id="multiplayer-back">
          Retour au menu
        </button>
        <button type="button" class="main-menu-account-bar__button" id="multiplayer-profile">
          Mon profil
        </button>
        <button
          type="button"
          class="main-menu-account-bar__button main-menu-account-bar__button--danger"
          id="multiplayer-logout"
        >
          Se déconnecter
        </button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
