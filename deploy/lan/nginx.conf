# Passerelle unique du déploiement LAN : le jeu et l'API de Supabase partagent une seule
# origine. Le navigateur ne voit donc jamais de requête inter-origine, et aucune règle CORS
# n'a besoin d'exister.
#
# Les préfixes reproduisent le routage de Kong dans la stack Supabase officielle, parce que
# c'est ce que `@supabase/supabase-js` construit à partir de `VITE_SUPABASE_URL` :
#
#   /auth/v1/…     → auth:9999/…
#   /rest/v1/…     → rest:3000/…
#   /realtime/v1/… → realtime:4000/socket/…
#   /game/…         → game-server:2567/… (HTTP et WebSocket Colyseus)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Journal dédié à la route de télémétrie. Le journal standard ne montre ni le type de contenu ni
# l'encodage, or c'est exactement ce qui distingue un lot accepté d'un lot refusé : le 2 août 2026,
# des lots partaient bien du navigateur et revenaient en 415 sans que rien ne dise pourquoi.
log_format otel '$time_local $status $request '
                'type="$http_content_type" encodage="$http_content_encoding" '
                'taille=$content_length';

server {
  listen 80;
  server_name _;

  # Le paquet de la page de jeu dépasse 7 Mo non minifié : sans compression, le premier
  # chargement depuis une autre machine du réseau est inutilement long.
  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 4m;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /realtime/v1/ {
    proxy_pass http://realtime-dev.supabase-realtime:4000/socket/;

    # Realtime lit l'identifiant de son locataire dans le sous-domaine de l'en-tête `Host`.
    # Transmettre l'hôte réel (une adresse IP) le ferait échouer à résoudre son locataire et
    # fermerait le websocket : on force donc le nom interne du conteneur.
    proxy_set_header Host realtime-dev.supabase-realtime;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Une partie coopérative garde le canal ouvert aussi longtemps qu'elle dure.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /game/ {
    proxy_pass http://game-server:2567/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  # Réception de la télémétrie du navigateur (OTLP/HTTP). Passer par la passerelle conserve
  # l'origine unique : aucune requête inter-origine, donc aucune règle CORS à écrire ni à
  # maintenir.
  location /otel/ {
    # Un collecteur arrêté ne doit pas empêcher nginx de démarrer : passer par une variable
    # diffère la résolution du nom à la requête, au lieu de l'exiger au chargement de la
    # configuration. Le `rewrite` retire le préfixe, que `proxy_pass` ne retire plus dans cette
    # forme.
    set $otel_upstream http://otel:4318;
    rewrite ^/otel/(.*)$ /$1 break;
    proxy_pass $otel_upstream;
    proxy_set_header Host $host;
    access_log /var/log/nginx/access.log otel;

    # La télémétrie ne doit jamais retenir le jeu. Si le collecteur est absent ou lent, la
    # requête échoue vite et le navigateur abandonne le lot — c'est le comportement voulu.
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    # DNS interne de Docker Compose.
    resolver 127.0.0.11 valid=10s;
  }

  # Outils de diagnostic du déploiement. Servis depuis un dossier distinct de celui du jeu :
  # ils survivent aux reconstructions et n'alourdissent pas le paquet livré aux joueurs.
  location /diagnostics/ {
    alias /usr/share/nginx/diagnostics/;
    autoindex on;
    # Un diagnostic doit toujours refléter sa dernière version, jamais une copie en cache.
    add_header Cache-Control "no-store" always;
  }

  # Paquets produits par la construction. Leur nom porte une empreinte du contenu : sous un même
  # nom, le contenu ne change jamais. On peut donc les garder indéfiniment, et c'est même
  # souhaitable — 7 Mo par premier chargement.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Le client est un site statique à deux pages ; il n'y a pas de routage côté client à
  # rattraper, donc pas de repli vers index.html.
  #
  # **Les pages, elles, doivent être revalidées à chaque chargement.** Sans en-tête explicite,
  # un navigateur applique une heuristique de fraîcheur et peut resservir une page ancienne
  # sans même interroger le serveur. Le 2 août 2026, deux postes ont ainsi joué une build
  # périmée pendant qu'une build corrigée était déployée : aucune requête n'est parvenue à la
  # passerelle, et la session de test a mesuré autre chose que ce qu'elle croyait mesurer.
  #
  # `no-cache` ne signifie pas « ne pas mettre en cache » mais « toujours revalider avant de
  # servir ». Le coût est d'une requête conditionnelle de quelques centaines d'octets ; le
  # bénéfice est qu'une page ne peut plus référencer un paquet périmé.
  location / {
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
